# ═══════════════════════════════════════════════════════════════════
# GarurSaili-CSS — Cross-Platform Build
# The Semantic Indian CSS Framework
# Author: Barshan Sarkar · Malda, West Bengal, India
# ═══════════════════════════════════════════════════════════════════

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  pkg: linux-x64-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, pkg: linux-x64-musl }
          - { os: macos-latest,   target: x86_64-apple-darwin,       pkg: darwin-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      pkg: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    pkg: win32-x64-msvc }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install npm deps
        working-directory: rust
        run: npm install

      - name: Build native module
        working-directory: rust
        shell: bash
        run: |
          npx napi build --platform --release --target ${{ matrix.target }}
          echo ""
          echo "=== Files in rust/ ==="
          ls -la
          echo ""
          echo "=== Search all .node files ==="
          find . -name "*.node" -type f

      - name: Move binary to platform folder
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.pkg }}
          find . -maxdepth 3 -name "garur_core*.node" -type f -exec cp -v {} npm/${{ matrix.pkg }}/ \;
          echo ""
          echo "=== Files staged in npm/${{ matrix.pkg }}/ ==="
          ls -la npm/${{ matrix.pkg }}/ || true
          test -n "$(ls -A npm/${{ matrix.pkg }}/*.node 2>/dev/null)" || {
            echo "❌ No .node file staged — aborting"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: npm/${{ matrix.pkg }}/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Distribute binaries to platform folders
        run: |
          for dir in artifacts/bindings-*; do
            target=$(basename "$dir" | sed 's/bindings-//')
            case "$target" in
              x86_64-unknown-linux-gnu)  pkg=linux-x64-gnu ;;
              x86_64-unknown-linux-musl) pkg=linux-x64-musl ;;
              x86_64-apple-darwin)       pkg=darwin-x64 ;;
              aarch64-apple-darwin)      pkg=darwin-arm64 ;;
              x86_64-pc-windows-msvc)    pkg=win32-x64-msvc ;;
            esac
            mkdir -p npm/$pkg
            cp -v "$dir"/*.node npm/$pkg/ || true
          done
          find npm -type f -name "*.node" -exec ls -lh {} \;

      - name: Publish platform packages
        run: |
          for pkg_dir in npm/*/; do
            pkg_name=$(basename "$pkg_dir")
            if [ ! -f "$pkg_dir"/*.node ]; then
              echo "⚠️  Skipping @garursaili/$pkg_name (no .node file)"
              continue
            fi

            PKG_VERSION=$(node -p "require('./$pkg_dir/package.json').version")

            if npm view "@garursaili/$pkg_name@$PKG_VERSION" version 2>/dev/null; then
              echo "⏭️  @garursaili/$pkg_name@$PKG_VERSION already published — skipping"
              continue
            fi

            echo "📦 Publishing @garursaili/$pkg_name@$PKG_VERSION..."
            (cd "$pkg_dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if main package version already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view garursaili-css@$PKG_VERSION version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "⚠️  v$PKG_VERSION already exists on npm — will skip publish"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "✅ v$PKG_VERSION is new — will publish"
          fi

      - name: Publish main package
        if: steps.check.outputs.already_published == 'false'
        run: |
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}