
# ═══════════════════════════════════════════════════════════════════
# GarurSaili-CSS — Cross-Platform Build & Publish
# The Semantic Indian CSS Framework
# Author: Barshan Sarkar · Malda, West Bengal, India
# ═══════════════════════════════════════════════════════════════════

name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# ─── Default permissions (least privilege) ───
permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════
  # BUILD — 5 platforms in parallel
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  pkg: linux-x64-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, pkg: linux-x64-musl }
          - { os: macos-latest,   target: x86_64-apple-darwin,       pkg: darwin-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      pkg: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    pkg: win32-x64-msvc }

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install npm deps
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build native module
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          echo "═══════════════════════════════════════════════════════"
          echo "Host:    $(uname -s -m 2>/dev/null || echo 'Windows')"
          echo "Target:  ${{ matrix.target }}"
          echo "Package: ${{ matrix.pkg }}"
          echo "═══════════════════════════════════════════════════════"
          npx napi build --platform --release --target ${{ matrix.target }}
          echo ""
          echo "=== .node files produced ==="
          find . -maxdepth 2 -name "*.node" -type f -exec ls -lh {} \;

      - name: Verify binary
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail

          SRC=$(find . -maxdepth 2 -name "*.node" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "❌ CRITICAL: napi build produced no .node file"
            exit 1
          fi

          SIZE=$(stat -c%s "$SRC" 2>/dev/null || stat -f%z "$SRC" 2>/dev/null || wc -c < "$SRC")
          echo "Found: $SRC"
          echo "Size:  $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ CRITICAL: Binary too small ($SIZE bytes < 1 MB)"
            exit 1
          fi

          MAGIC_HEX=$(od -An -tx1 -N4 "$SRC" | tr -d ' \n' | tr 'A-F' 'a-f')
          echo "Magic: $MAGIC_HEX"

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu|x86_64-unknown-linux-musl)
              if [ "$MAGIC_HEX" != "7f454c46" ]; then
                echo "❌ Expected ELF (7f454c46), got: $MAGIC_HEX"
                exit 1
              fi
              echo "✅ ELF binary verified"
              ;;
            x86_64-apple-darwin|aarch64-apple-darwin)
              if [ "$MAGIC_HEX" != "cffaedfe" ] && [ "$MAGIC_HEX" != "feedfacf" ]; then
                echo "❌ Expected Mach-O (cffaedfe/feedfacf), got: $MAGIC_HEX"
                exit 1
              fi
              echo "✅ Mach-O binary verified"
              ;;
            x86_64-pc-windows-msvc)
              MAGIC_PE=$(od -An -tx1 -N2 "$SRC" | tr -d ' \n' | tr 'A-F' 'a-f')
              if [ "$MAGIC_PE" != "4d5a" ]; then
                echo "❌ Expected PE/MS Windows (4d5a), got: $MAGIC_PE"
                exit 1
              fi
              echo "✅ PE/Windows binary verified"
              ;;
            *)
              echo "❌ Unknown target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Rename to canonical
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail

          SRC=$(find . -maxdepth 1 -name "*.node" -type f | head -1)
          DEST="garur_core.${{ matrix.pkg }}.node"

          if [ "$SRC" != "./$DEST" ] && [ "$SRC" != "$DEST" ]; then
            echo "Renaming: $(basename "$SRC") → $DEST"
            mv -v "$SRC" "$DEST"
          fi

          echo ""
          echo "=== rust/*.node ==="
          ls -la *.node

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "npm/${{ matrix.pkg }}"

          SRC="rust/garur_core.${{ matrix.pkg }}.node"
          DEST="npm/${{ matrix.pkg }}/garur_core.${{ matrix.pkg }}.node"

          if [ ! -f "$SRC" ]; then
            echo "❌ CRITICAL: $SRC not found"
            ls -la rust/*.node 2>/dev/null || true
            exit 1
          fi

          cp -v "$SRC" "$DEST"

          echo ""
          echo "=== Staged: npm/${{ matrix.pkg }}/ ==="
          ls -la "npm/${{ matrix.pkg }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bindings-${{ matrix.target }}
          path: npm/${{ matrix.pkg }}/garur_core.${{ matrix.pkg }}.node
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ═══════════════════════════════════════════════════════════════
  # PUBLISH — only on tag push
  # ═══════════════════════════════════════════════════════════════
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Distribute binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "═══ Downloaded artifacts ═══"
          find artifacts -type f -name "*.node" -exec ls -lh {} \;

          for dir in artifacts/bindings-*; do
            target=$(basename "$dir" | sed 's/bindings-//')

            case "$target" in
              x86_64-unknown-linux-gnu)  pkg=linux-x64-gnu ;;
              x86_64-unknown-linux-musl) pkg=linux-x64-musl ;;
              x86_64-apple-darwin)       pkg=darwin-x64 ;;
              aarch64-apple-darwin)      pkg=darwin-arm64 ;;
              x86_64-pc-windows-msvc)    pkg=win32-x64-msvc ;;
              *) echo "❌ Unknown target: $target"; exit 1 ;;
            esac

            mkdir -p "npm/$pkg"

            SRC="$dir/garur_core.$pkg.node"
            DEST="npm/$pkg/garur_core.$pkg.node"

            if [ ! -f "$SRC" ]; then
              echo "❌ CRITICAL: $SRC missing"
              ls -la "$dir" || true
              exit 1
            fi

            cp -v "$SRC" "$DEST"

            SIZE=$(stat -c%s "$DEST")
            if [ "$SIZE" -lt 1000000 ]; then
              echo "❌ CRITICAL: $DEST too small ($SIZE bytes)"
              exit 1
            fi
          done

          echo ""
          echo "═══ Final distribution ═══"
          find npm -type f -name "*.node" -exec ls -lh {} \;

      - name: Sync platform versions + files field
        shell: bash
        run: |
          set -euo pipefail
          ROOT_VERSION=$(node -p "require('./package.json').version")
          echo "Syncing platform packages to $ROOT_VERSION"

          for pkg_dir in npm/*/; do
            if [ ! -f "$pkg_dir/package.json" ]; then continue; fi

            node -e "
              const fs = require('fs');
              const path = require('path');
              const dir = '$pkg_dir'.replace(/\/$/, '');
              const pkgName = path.basename(dir);
              const p = path.join(dir, 'package.json');
              const pkg = JSON.parse(fs.readFileSync(p, 'utf-8'));
              pkg.version = '$ROOT_VERSION';
              pkg.files = ['garur_core.' + pkgName + '.node'];
              pkg.main = 'garur_core.' + pkgName + '.node';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
              console.log('  ✓ ' + pkg.name + '@' + pkg.version + ' files=' + JSON.stringify(pkg.files));
            "
          done

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail

          for pkg_dir in npm/*/; do
            pkg_name=$(basename "$pkg_dir")
            expected="garur_core.$pkg_name.node"

            if [ ! -f "$pkg_dir$expected" ]; then
              echo "❌ CRITICAL: @garursaili/$pkg_name — $expected missing"
              ls -la "$pkg_dir" || true
              exit 1
            fi

            SIZE=$(stat -c%s "$pkg_dir$expected")
            if [ "$SIZE" -lt 1000000 ]; then
              echo "❌ CRITICAL: @garursaili/$pkg_name — binary too small ($SIZE bytes)"
              exit 1
            fi

            PKG_VERSION=$(node -p "require('./$pkg_dir/package.json').version")

            if npm view "@garursaili/$pkg_name@$PKG_VERSION" version 2>/dev/null; then
              echo "⏭️  @garursaili/$pkg_name@$PKG_VERSION already published — skipping"
              continue
            fi

            echo "📦 Publishing @garursaili/$pkg_name@$PKG_VERSION (binary: $SIZE bytes)"
            (cd "$pkg_dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check main package
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")

          if npm view garursaili-css@$PKG_VERSION version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "⚠️  v$PKG_VERSION already published — will skip main"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "✅ v$PKG_VERSION is new — will publish"
          fi

      - name: Build TypeScript
        if: steps.check.outputs.already_published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Publish main package
        if: steps.check.outputs.already_published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attest build provenance
        if: steps.check.outputs.already_published == 'false'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-path: |
            dist/**/*.js
            dist/**/*.d.ts
            npm/**/*.node
