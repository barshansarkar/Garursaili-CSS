[package]
name = "garur-saili-css"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
rustc-hash = "1.1"
once_cell = "1"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["browserslist", "bundler"] }
base64 = "0.22"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true