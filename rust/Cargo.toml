[package]
name = "garur_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust core for GarurSaili-CSS"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi6"] }
napi-derive = "2.16"
rayon = "1.10"
memmap2 = "0.9"
regex = "1.11"
once_cell = "1.20"
rustc-hash = "2.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
globset = "0.4"
walkdir = "2.5"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true